{% assign counter_lang = page.lang | default: "en" %}

  <span data-visitor-count></span>
  <span>{% if counter_lang == 'fr' %}visiteurs estimés{% elsif counter_lang == 'ja' %}推定訪問者数{% else %}estimated visitors{% endif %}</span>
  <a href="https://github.com/soxft/busuanzi" class="visitor-counter__info" aria-label="{% if counter_lang == 'fr' %}À propos du compteur de visiteurs{% elsif counter_lang == 'ja' %}訪問者カウンターについて{% else %}About the visitor counter{% endif %}" title="{% if counter_lang == 'fr' %}Estimation depuis le 14 septembre 2026 · Busuanzi{% elsif counter_lang == 'ja' %}2026年9月14日からの推定値 · Busuanzi{% else %}Estimate since September 14, 2026 · Busuanzi{% endif %}">ⓘ</a>
</span>
